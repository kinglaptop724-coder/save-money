<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบออมเงินนักเรียน</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#4892d0">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ออมเงิน">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script src="config.js"></script>
  <script src="gas-bridge.js"></script>
  <script src="pwa.js" defer></script>
  <style id="boot-style">
    html,body{margin:0;height:100%}
    #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
      background:linear-gradient(160deg,#6fb4ee,#3f85be);color:#fff;font:500 16px/1.4 'IBM Plex Sans Thai',system-ui,sans-serif;text-align:center;padding:24px}
    #boot img{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
    #boot .sp{width:30px;height:30px;border:4px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:bs .8s linear infinite}
    @keyframes bs{to{transform:rotate(360deg)}}
    #boot button{border:0;border-radius:10px;padding:10px 20px;font:inherit;background:#fff;color:#2f6fa5;cursor:pointer}
    #updBar{position:fixed;left:12px;right:12px;top:12px;z-index:100000;max-width:420px;margin:0 auto;display:flex;gap:10px;align-items:center;
      padding:10px 12px;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.25);font:500 14px/1.4 'IBM Plex Sans Thai',sans-serif;color:#242e35}
    #updBar span{flex:1}#updBar button{border:0;border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer;background:#4892d0;color:#fff}
    #updBar button.x{background:transparent;color:#888;padding:8px}
  </style>
</head>
<body>
  <div id="boot"><img src="icons/icon-192.png" alt=""><div class="sp"></div><div id="bootMsg">กำลังโหลดระบบ...</div></div>
<script>
/* ตัวโหลดหน้าเว็บ: ดึง HTML ของระบบจากไฟล์ "Index" ใน Apps Script มาแสดง
   แก้หน้าเว็บที่ Apps Script แล้ว Deploy ใหม่ ไม่ต้องแตะ GitHub อีก
   - มีแคชในเครื่อง => เปิดทันที แล้วเช็กเวอร์ชันใหม่เบื้องหลัง (ถ้ามีจะขึ้นแถบให้กดโหลดใหม่)
   - ยังไม่มีแคช => รอโหลดจาก Apps Script ครั้งแรก */
(function () {
  var CACHE_KEY = "app_html_v1";
  var SKIP_SRC = /(^|\/)(config|gas-bridge|pwa)\.js(\?|$)/;               // ตัวที่ shell โหลดไว้แล้ว
  var SKIP_HEAD = /^(manifest|icon|apple-touch-icon)$/i;

  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }

  function readCache() { try { return localStorage.getItem(CACHE_KEY) || ""; } catch (e) { return ""; } }
  function writeCache(h) { try { localStorage.setItem(CACHE_KEY, h); } catch (e) {} }

  function fetchHtml() {
    var base = (window.APP_CONFIG || {}).API_URL || "";
    if (!base) return Promise.reject(new Error("ยังไม่ได้ตั้งค่า API_URL ใน config.js"));
    return fetch(base + (base.indexOf("?") < 0 ? "?" : "&") + "page=ui&t=" + Date.now(), { redirect: "follow" })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var j; try { j = JSON.parse(t); } catch (e) { throw new Error("Apps Script ตอบกลับผิดรูปแบบ (ตรวจว่า Deploy เวอร์ชันใหม่แล้ว)"); }
        if (!j || !j.ok || !j.html) throw new Error((j && j.error) || "ไม่พบไฟล์ Index ใน Apps Script");
        return j.html;
      });
  }

  function showError(msg) {
    var b = document.getElementById("boot");
    if (!b) return;
    b.innerHTML = '<div>โหลดระบบไม่สำเร็จ</div><div style="font-size:13px;opacity:.9;max-width:320px"></div><button id="bootRetry">ลองใหม่</button>';
    b.children[1].textContent = msg;
    document.getElementById("bootRetry").onclick = function () { location.reload(); };
  }

  function cloneScript(old) {
    var n = document.createElement("script");
    for (var i = 0; i < old.attributes.length; i++) n.setAttribute(old.attributes[i].name, old.attributes[i].value);
    n.async = false;
    n.text = old.textContent;
    return n;
  }

  // วาง HTML ลงหน้า แล้วรัน <script> ตามลำดับเดิม (ตัวนอกรอโหลดเสร็จก่อนค่อยไปตัวถัดไป)
  function render(html) {
    var doc = new DOMParser().parseFromString(html, "text/html");

    document.title = doc.title || document.title;
    var bs = document.getElementById("boot-style"); if (bs) bs.remove();

    Array.prototype.slice.call(doc.head.children).forEach(function (el) {
      var tag = el.tagName;
      if (tag === "TITLE" || tag === "META") return;
      if (tag === "LINK" && SKIP_HEAD.test(el.getAttribute("rel") || "")) return;
      if (tag === "SCRIPT" && SKIP_SRC.test(el.getAttribute("src") || "")) return;
      document.head.appendChild(document.importNode(el, true));
    });

    for (var i = 0; i < doc.body.attributes.length; i++) {
      var a = doc.body.attributes[i];
      document.body.setAttribute(a.name, a.value);
    }
    document.body.innerHTML = "";
    Array.prototype.slice.call(doc.body.childNodes).forEach(function (n) {
      document.body.appendChild(document.importNode(n, true));
    });

    var scripts = Array.prototype.slice.call(document.querySelectorAll("script"))
      .filter(function (s) { return !s.__done && !/^(boot|loader)$/.test(s.id || "") && !s.hasAttribute("data-shell"); });

    // เอาสคริปต์ของ shell ออกจากรายการ (ตัวแรกที่เป็นตัวโหลดนี้เอง และ config/gas-bridge/pwa)
    scripts = scripts.filter(function (s) {
      var src = s.getAttribute("src") || "";
      if (SKIP_SRC.test(src)) return false;
      if (!src && s.textContent.indexOf("CACHE_KEY = \"app_html_v1\"") >= 0) return false;
      return true;
    });

    return scripts.reduce(function (p, old) {
      return p.then(function () {
        return new Promise(function (resolve) {
          var n = cloneScript(old);
          n.__done = true;
          if (old.src) { n.onload = n.onerror = function () { resolve(); }; }
          old.replaceWith(n);
          if (!old.src) resolve();
        });
      });
    }, Promise.resolve()).then(function () {
      // สคริปต์ของหน้าเดิมรอ DOMContentLoaded/load จึงยิงให้เอง เพราะหน้าโหลดเสร็จไปก่อนแล้ว
      document.dispatchEvent(new Event("DOMContentLoaded", { bubbles: true }));
      window.dispatchEvent(new Event("load"));
    });
  }

  function showUpdateBar() {
    if (document.getElementById("updBar")) return;
    var d = document.createElement("div");
    d.id = "updBar";
    d.innerHTML = '<span>มีเวอร์ชันใหม่ของระบบ</span><button type="button">โหลดใหม่</button><button type="button" class="x" aria-label="ปิด">✕</button>';
    d.children[1].onclick = function () { location.reload(); };
    d.children[2].onclick = function () { d.remove(); };
    document.body.appendChild(d);
  }

  var cached = readCache();
  if (cached) {
    render(cached).then(function () {
      fetchHtml().then(function (fresh) {
        if (fresh !== cached) { writeCache(fresh); showUpdateBar(); }
      }).catch(function () {});
    });
  } else {
    fetchHtml().then(function (fresh) {
      writeCache(fresh);
      return render(fresh);
    }).catch(function (e) { showError(e && e.message ? e.message : String(e)); });
  }
})();
</script>
</body>
</html>
